[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-personal-mix"
version = "0.1.0"
description = "Local, explainable YouTube Music history recommender and playlist builder"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
connectors = ["playwright>=1.45,<2", "ytmusicapi>=1.11,<2"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
